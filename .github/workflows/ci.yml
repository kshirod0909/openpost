name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  api:
    name: API (.NET 10)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore OpenPost.slnx

      - name: Build
        run: dotnet build OpenPost.slnx -c Release --no-restore

      - name: Test
        run: dotnet test OpenPost.slnx -c Release --no-build --logger "trx;LogFileName=results.trx"

      - name: Publish
        run: dotnet publish src/OpenPost.Api/OpenPost.Api.csproj -c Release -o out

  web:
    name: Web (Angular 20)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: src/web/package-lock.json

      - name: Install
        run: npm ci

      - name: Build (production)
        run: npm run build

      - uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: src/web/dist
          retention-days: 7

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    needs: [api]
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: src/OpenPost.Api/Dockerfile
          push: false
          tags: openpost/api:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
